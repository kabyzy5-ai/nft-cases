<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFT Кейс 🔥</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.5s;
            position: relative;
            overflow: hidden;
        }

        /* ===== АНИМАЦИОННЫЙ ФОН ===== */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 30% 40%, rgba(255,255,255,0.03) 0%, transparent 60%),
                radial-gradient(circle at 70% 80%, rgba(255,255,255,0.02) 0%, transparent 50%);
            animation: bgMove 15s ease-in-out infinite alternate;
            z-index: 0;
        }

        @keyframes bgMove {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(5%, 5%) rotate(5deg); }
        }

        /* ===== КОНТЕЙНЕР ===== */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        /* ===== ЗАГОЛОВОК ===== */
        .title {
            font-size: 14px;
            letter-spacing: 6px;
            text-transform: uppercase;
            opacity: 0.3;
            font-weight: 300;
            animation: fadeInDown 1s ease;
        }

        /* ===== КЕЙС (ава) ===== */
        .case-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .case-wrapper:active {
            transform: scale(0.92);
        }

        #caseImage {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.08);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            transition: box-shadow 0.5s, filter 0.5s;
            filter: grayscale(100%) brightness(0.7);
        }

        #caseImage.unlocked {
            filter: grayscale(0%) brightness(1);
            box-shadow: 0 0 80px rgba(255,255,255,0.15);
        }

        /* ===== ТАЙМЕР ===== */
        .timer-container {
            text-align: center;
            opacity: 0.6;
            font-size: 13px;
            letter-spacing: 2px;
            font-weight: 300;
        }

        #timer {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 4px;
            color: #fff;
            margin-top: 5px;
            font-variant-numeric: tabular-nums;
        }

        /* ===== КНОПКА (минималистичная) ===== */
        .btn {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 16px 50px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 300px;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transition: left 0.6s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:active {
            transform: scale(0.94);
            border-color: rgba(255,255,255,0.3);
        }

        .btn:disabled {
            opacity: 0.2;
            transform: scale(1);
            cursor: not-allowed;
        }

        /* ===== ВСПЫШКА ===== */
        #flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.05s;
        }

        #flash.active {
            opacity: 1;
            transition: opacity 0s;
        }

        /* ===== Анимации ===== */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        .pulsing {
            animation: pulse 2s ease-in-out infinite;
        }

        /* ===== Реферальная ссылка ===== */
        .ref-link {
            margin-top: 10px;
            padding: 12px 20px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            font-size: 11px;
            opacity: 0.3;
            word-break: break-all;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            width: 100%;
            transition: opacity 0.5s;
        }

        .ref-link.revealed {
            opacity: 0.6;
            border-color: rgba(255,255,255,0.1);
        }

        /* ===== СТАТУС ===== */
        #status {
            font-size: 13px;
            opacity: 0.4;
            letter-spacing: 1px;
            min-height: 24px;
            transition: all 0.5s;
        }
    </style>
</head>
<body>

    <!-- ВСПЫШКА -->
    <div id="flash"></div>

    <div class="container">
        <div class="title">✦ ЗАКРЫТЫЙ КЕЙС ✦</div>

        <div class="case-wrapper" id="caseWrapper">
            <img id="caseImage" src="https://avatars.mds.yandex.net/i?id=97567c5eb5703dc49fb3cacf70bdbce6_l-5575082-images-thumbs&n=13" alt="Кейс">
        </div>

        <div class="timer-container">
            <div>ДО РАЗБЛОКИРОВКИ</div>
            <div id="timer">10:00</div>
        </div>

        <button class="btn" id="openBtn">✧ ОТКРЫТЬ ✧</button>

        <div id="status">Ожидание...</div>

        <div class="ref-link" id="refLink">🔗 Твоя ссылка появится после открытия</div>
    </div>

    <script>
        // ===== ИНИЦИАЛИЗАЦИЯ TELEGRAM =====
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // ===== ЭЛЕМЕНТЫ =====
        const caseImage = document.getElementById('caseImage');
        const timerDisplay = document.getElementById('timer');
        const openBtn = document.getElementById('openBtn');
        const status = document.getElementById('status');
        const refLink = document.getElementById('refLink');
        const flash = document.getElementById('flash');
        const caseWrapper = document.getElementById('caseWrapper');

        // ===== ПЕРЕМЕННЫЕ =====
        let timeLeft = 600; // 10 минут
        let isUnlocked = false;
        let timerInterval = null;

        // ===== NFT (ПОЗЖЕ ДОБАВИШЬ) =====
        const nftData = {
            name: 'Meme God',
            image: 'https://i.ibb.co/8d5KpNq/pepe-nft.png' // ВСТАВЬ СВОЮ РАБОЧУЮ ССЫЛКУ
        };

        // ===== ТАЙМЕР =====
        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    unlockCase();
                }
            }, 1000);
        }

        // ===== РАЗБЛОКИРОВКА КЕЙСА =====
        function unlockCase() {
            isUnlocked = true;
            caseImage.classList.add('unlocked');
            timerDisplay.textContent = '✦ ГОТОВО ✦';
            status.textContent = '🔓 Кейс разблокирован! Нажми "ОТКРЫТЬ"';
            openBtn.disabled = false;
            openBtn.style.borderColor = 'rgba(255,255,255,0.3)';
        }

        // ===== ВСПЫШКА =====
        function triggerFlash() {
            flash.classList.add('active');
            setTimeout(() => {
                flash.classList.remove('active');
            }, 200);
        }

        // ===== ОТКРЫТИЕ КЕЙСА =====
        function openCase() {
            if (!isUnlocked) {
                status.textContent = '⏳ Подожди 10 минут!';
                return;
            }

            // ВСПЫШКА
            triggerFlash();

            // Меняем картинку на NFT
            caseImage.src = nftData.image;
            caseImage.style.borderRadius = '16px';
            caseImage.style.objectFit = 'contain';
            caseImage.style.background = '#0a0a0a';
            caseImage.style.padding = '20px';

            status.textContent = `🎉 Ты получил: ${nftData.name}!`;

            // Отключаем кнопку
            openBtn.disabled = true;
            openBtn.textContent = '✓ ПОЛУЧЕНО';

            // Показываем реферальную ссылку
            showRefLink();

            // Отправляем данные в Telegram бота
            tg.sendData(JSON.stringify({
                action: 'nft_claimed',
                nft: nftData.name
            }));
        }

        // ===== РЕФЕРАЛЬНАЯ ССЫЛКА =====
        function showRefLink() {
            const botUsername = 'nft_cases_bot'; // ИМЯ ТВОЕГО БОТА
            const userId = tg.initDataUnsafe?.user?.id || 'YOUR_ID';
            const link = `https://t.me/${botUsername}?start=${userId}`;
            
            refLink.textContent = `🔗 Твоя реферальная ссылка (действует 30 минут): ${link}`;
            refLink.classList.add('revealed');

            // Таймер на 30 минут для ссылки
            setTimeout(() => {
                refLink.textContent = '⏳ Срок действия ссылки истёк';
                refLink.style.opacity = '0.2';
            }, 1800000); // 30 минут
        }

        // ===== СОБЫТИЯ =====
        openBtn.addEventListener('click', openCase);

        caseWrapper.addEventListener('click', function() {
            if (isUnlocked) {
                triggerFlash();
                // Эффект "ослепления" при клике на кейс
                setTimeout(() => {
                    status.textContent = '✨ Кейс активирован!';
                }, 100);
            }
        });

        // ===== ЗАПУСК =====
        startTimer();
        status.textContent = '⏳ Ожидай 10 минут...';
        openBtn.disabled = true;

        // ===== ОТПРАВКА ДАННЫХ В БОТА =====
        console.log('Мини-апп загружен!');
    </script>
</body>
</html>
