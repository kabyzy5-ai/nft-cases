<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Antidot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            padding-bottom: 80px;
            overflow-x: hidden;
        }

        /* ===== ВЕРХНИЙ БАР ===== */
        .header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .header .logo {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .header .balance {
            font-size: 14px;
            opacity: 0.6;
        }

        /* ===== КОНТЕНТ ===== */
        .content {
            padding: 20px;
            max-width: 400px;
            margin: 0 auto;
        }

        /* ===== КВЕСТЫ ===== */
        .quest-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.3s;
        }

        .quest-card.completed {
            opacity: 0.4;
            border-color: rgba(255,255,255,0.02);
        }

        .quest-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .quest-icon img {
            width: 28px;
            height: 28px;
            filter: invert(1) brightness(0.8);
        }

        .quest-info {
            flex: 1;
        }

        .quest-info .title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .quest-info .desc {
            font-size: 12px;
            opacity: 0.4;
        }

        .quest-reward {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            font-weight: 600;
            color: #f7971e;
        }

        .quest-reward img {
            width: 18px;
            height: 18px;
            filter: invert(1) brightness(0.8);
        }

        .quest-btn {
            background: rgba(255,255,255,0.08);
            border: none;
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .quest-btn:active {
            transform: scale(0.94);
        }

        .quest-btn.done {
            background: rgba(255,255,255,0.02);
            opacity: 0.3;
        }

        /* ===== НИЖНЕЕ МЕНЮ ===== */
        .bottom-menu {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10,10,10,0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 100;
        }

        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            padding: 4px 12px;
            transition: all 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .menu-item:active {
            transform: scale(0.92);
        }

        .menu-item img {
            width: 26px;
            height: 26px;
            filter: invert(1) brightness(0.3);
            transition: all 0.3s;
        }

        .menu-item.active img {
            filter: invert(1) brightness(1);
        }

        .menu-item span {
            font-size: 9px;
            opacity: 0.3;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .menu-item.active span {
            opacity: 0.8;
        }

        /* ===== СТРАНИЦЫ ===== */
        .page {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== ГЛАВНАЯ ===== */
        .welcome {
            text-align: center;
            padding: 30px 0;
        }

        .welcome h2 {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }

        .welcome p {
            opacity: 0.3;
            font-size: 13px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <!-- ===== ВЕРХНИЙ БАР ===== -->
    <div class="header">
        <div class="logo">✦ ANTIDOT</div>
        <div class="balance">🎰 0</div>
    </div>

    <!-- ===== КОНТЕНТ ===== -->
    <div class="content">

        <!-- ===== ГЛАВНАЯ ===== -->
        <div class="page active" id="page-home">
            <div class="welcome">
                <h2>✦ КЕЙСЫ ✦</h2>
                <p>открывай и получай награды</p>
            </div>
            <!-- Тут будет твой кейс -->
        </div>

        <!-- ===== КВЕСТЫ ===== -->
        <div class="page" id="page-quests">
            <h3 style="margin-bottom:16px;font-weight:300;letter-spacing:2px;opacity:0.6;">✦ КВЕСТЫ</h3>

            <!-- Квест 1 -->
            <div class="quest-card" id="quest1">
                <div class="quest-icon">
                    <img src="https://cdn-icons-png.flaticon.com/512/5968/5968895.png" alt="tg">
                </div>
                <div class="quest-info">
                    <div class="title">Подписаться на канал</div>
                    <div class="desc">@AntidotChannel</div>
                </div>
                <div class="quest-reward">
                    <img src="https://cdn-icons-png.flaticon.com/512/1047/1047501.png" alt="reward">
                    1
                </div>
                <button class="quest-btn" onclick="checkQuest(1)">→</button>
            </div>

            <!-- Квест 2 -->
            <div class="quest-card" id="quest2">
                <div class="quest-icon">
                    <img src="https://cdn-icons-png.flaticon.com/512/5968/5968895.png" alt="tg">
                </div>
                <div class="quest-info">
                    <div class="title">Зайти в чат</div>
                    <div class="desc">@AntidotChat</div>
                </div>
                <div class="quest-reward">
                    <img src="https://cdn-icons-png.flaticon.com/512/1047/1047501.png" alt="reward">
                    3
                </div>
                <button class="quest-btn" onclick="checkQuest(2)">→</button>
            </div>

            <!-- Квест 3 -->
            <div class="quest-card" id="quest3">
                <div class="quest-icon">
                    <img src="https://cdn-icons-png.flaticon.com/512/2838/2838912.png" alt="time">
                </div>
                <div class="quest-info">
                    <div class="title">Подождать 1 час</div>
                    <div class="desc">⏳ вернись через час</div>
                </div>
                <div class="quest-reward">
                    <img src="https://cdn-icons-png.flaticon.com/512/1047/1047501.png" alt="reward">
                    6
                </div>
                <button class="quest-btn" onclick="checkQuest(3)">→</button>
            </div>
        </div>

    </div>

    <!-- ===== НИЖНЕЕ МЕНЮ ===== -->
    <div class="bottom-menu">
        <div class="menu-item active" onclick="switchPage('home')">
            <img src="https://cdn-icons-png.flaticon.com/512/25/25694.png" alt="home">
            <span>ГЛАВНАЯ</span>
        </div>
        <div class="menu-item" onclick="switchPage('quests')">
            <img src="https://cdn-icons-png.flaticon.com/512/1047/1047524.png" alt="quests">
            <span>КВЕСТЫ</span>
        </div>
        <div class="menu-item" onclick="switchPage('home')">
            <img src="https://cdn-icons-png.flaticon.com/512/1077/1077114.png" alt="friends">
            <span>ДРУЗЬЯ</span>
        </div>
        <div class="menu-item" onclick="switchPage('home')">
            <img src="https://cdn-icons-png.flaticon.com/512/1374/1374393.png" alt="wallet">
            <span>КОШЕЛЕК</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // ===== ПЕРЕКЛЮЧЕНИЕ СТРАНИЦ =====
        function switchPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + page).classList.add('active');

            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            document.querySelector(`.menu-item:nth-child(${page === 'home' ? 1 : page === 'quests' ? 2 : 3})`).classList.add('active');
        }

        // ===== КВЕСТЫ (ПРОВЕРКА) =====
        function checkQuest(id) {
            const card = document.getElementById('quest' + id);
            const btn = card.querySelector('.quest-btn');

            if (btn.classList.contains('done')) {
                return;
            }

            // Имитация выполнения
            btn.textContent = '✓';
            btn.classList.add('done');
            card.classList.add('completed');

            // Отправка в бота
            tg.sendData(JSON.stringify({
                action: 'quest_done',
                quest_id: id
            }));

            // Обновляем баланс (пример)
            const balance = document.querySelector('.balance');
            const current = parseInt(balance.textContent.replace('🎰 ', ''));
            const rewards = {1: 1, 2: 3, 3: 6};
            balance.textContent = '🎰 ' + (current + rewards[id]);
        }

        console.log('Antidot Mini App loaded!');
    </script>
</body>
</html>
